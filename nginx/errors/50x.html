<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис временно недоступен — Expense Tracker</title>
<style>
  :root {
    --primary: #1E88E5;
    --accent: #FFC107;
    --background: #f8fafc;
    --foreground: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  button, a.button {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  a.secondary {
    background: transparent;
    color: var(--foreground);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4"/>
        <path d="m16.2 7.8 2.9-2.9"/>
        <path d="M18 12h4"/>
        <path d="m16.2 16.2 2.9 2.9"/>
        <path d="M12 18v4"/>
        <path d="m4.9 19.1 2.9-2.9"/>
        <path d="M2 12h4"/>
        <path d="m4.9 4.9 2.9 2.9"/>
      </svg>
    </div>
    <h1>Сервис временно недоступен</h1>
    <p>Мы уже знаем о проблеме и работаем над её устранением. Попробуйте обновить страницу через пару минут.</p>
    <div class="actions">
      <button onclick="location.reload()">Обновить</button>
      <a class="button secondary" href="/">На главную</a>
    </div>
  </div>
</body>
</html>
