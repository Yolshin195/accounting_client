<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Некорректный запрос — Expense Tracker</title>
<style>
  :root {
    --primary: #1E88E5;
    --accent: #FFC107;
    --background: #f8fafc;
    --foreground: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  a.button {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
  }
  a.button:hover {
    opacity: 0.9;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 9v4"/>
        <path d="M12 17h.01"/>
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
      </svg>
    </div>
    <h1>Некорректный запрос</h1>
    <p>Не удалось обработать запрос к серверу. Возможно, ссылка устарела или адрес указан неверно.</p>
    <a class="button" href="/">Вернуться на главную</a>
  </div>
</body>
</html>
