version: '3.8'

services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
      - "3443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro   # монтируем локальные сертификаты
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - app-network

  api:
    image: alexey195/accountingapi:latest
    ports:
      - "8888:8888"
    env_file:
      - .env-docker
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - app-network
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=accounting_db
    volumes:
      - accounting_postgres_data:/var/lib/postgresql/data
    ports:
      - "5445:5432"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  accounting_postgres_data:

networks:
  app-network:
    driver: bridge
