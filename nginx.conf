server {
    listen 80;
    server_name example.com;

    server_tokens off;

    # редирект с http на https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;

    # не сообщаем клиентам ни о том, что это nginx, ни о его версии
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/certificate.crt;   # твой сертификат
    ssl_certificate_key /etc/nginx/ssl/private.key;       # твой приватный ключ
    ssl_trusted_certificate /etc/nginx/ssl/root.crt;      # корневой/цепочка

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # если на HTTPS-порт пришёл обычный HTTP-запрос — молча редиректим на https,
    # вместо стандартной служебной страницы со стеком/версией сервера
    error_page 497 https://$host:$server_port$request_uri;

    # фронтенд (статический экспорт Next.js: у каждого роута свой .html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # проксирование API
    location /api/ {
        proxy_pass http://${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # собственные страницы ошибок вместо стандартных страниц сервера
    error_page 400 /errors/400.html;
    error_page 500 502 503 504 /errors/50x.html;
    location ^~ /errors/ {
        internal;
    }

    error_page 404 /404.html;
}
