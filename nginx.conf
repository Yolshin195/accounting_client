server {
    listen 80;
    server_name example.com;

    # редирект с http на https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/certificate.crt;   # твой сертификат
    ssl_certificate_key /etc/nginx/ssl/private.key;       # твой приватный ключ
    ssl_trusted_certificate /etc/nginx/ssl/root.crt;      # корневой/цепочка

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # фронтенд (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # проксирование API
    location /api/ {
        proxy_pass http://api:8888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 404 /index.html;
}
